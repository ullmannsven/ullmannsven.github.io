{% assign pub = include.post %}
{% if pub.arxiv or pub.doi or pub.paperurl or pub.codeurl %}
<p class="publication__links">
  {% if pub.doi %}<a class="btn btn--inverse btn--small" href="https://doi.org/{{ pub.doi }}"><i class="fas fa-fw fa-book" aria-hidden="true"></i> DOI</a>{% endif %}
  {% if pub.arxiv %}<a class="btn btn--inverse btn--small" href="https://arxiv.org/abs/{{ pub.arxiv }}"><i class="ai ai-fw ai-arxiv" aria-hidden="true"></i> arXiv:{{ pub.arxiv }}</a>{% endif %}
  {% if pub.paperurl %}<a class="btn btn--inverse btn--small" href="{{ pub.paperurl }}"><i class="fas fa-fw fa-file-pdf" aria-hidden="true"></i> PDF</a>{% endif %}
  {% if pub.codeurl %}<a class="btn btn--inverse btn--small" href="{{ pub.codeurl }}"><i class="fab fa-fw fa-github" aria-hidden="true"></i> Code</a>{% endif %}
</p>
{% endif %}
